project_id = "health-federation"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "fedzdorovya://"
additional_redirect_urls = ["fedzdorovya://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Приложение открывается до всякого логина: человек листает бесплатные гайды,
# а прогресс всё равно нужно куда-то писать. Анонимная сессия становится
# постоянной при первой покупке или записи к тренеру.
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
