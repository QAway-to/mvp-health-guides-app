# Web-версия приложения (Expo → React Native Web) как статический сайт.
# Нативные сборки (Android/iOS) сюда не относятся — они собираются через EAS.
#
# ПЕРЕМЕННЫХ ОКРУЖЕНИЯ ЗДЕСЬ БОЛЬШЕ НЕТ. Раньше стояли ключи Supabase с
# `sync: false`, то есть деплой не начинался, пока их не заполнят в дашборде.
# Сервера у приложения сейчас нет: карточки лежат в коде, своя карточка — в
# хранилище браузера. Пустая сборка собирается и открывается сама по себе.
services:
  - type: web
    name: health-federation-web
    runtime: static
    rootDir: apps/mobile
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    routes:
      # web.output = single: весь роутинг живёт на клиенте, поэтому любой путь
      # отдаёт index.html, иначе перезагрузка на /card/<id> даст 404.
      - type: rewrite
        source: /*
        destination: /index.html
